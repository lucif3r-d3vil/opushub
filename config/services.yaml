# OpusHub — services
# This file is the source of truth for the Services directory.
# Edit it in Settings → Services (or by hand; comments here are preserved when OpusHub writes).
#
# Per service:
#   name        display name
#   app         the software behind it (shown as identity)
#   description one line, used in search too
#   href        where to open it
#   icon        lucide:*/mdi:*/si:* (bundled, offline-safe), http(s) URL, /user/icons/<file>, or a short emoji
#   container   docker container name to bind live status to (optional; falls back to name matching)
#   stack       stack membership (optional, mirrors stacks.yaml)
#   meta        free-form key/value facts shown on the service page (optional)

groups:
  - name: Media
    description: Streams, requests, the fun bits
    services:
      - name: Stream
        app: Jellyfin
        description: Movies and TV, streamed anywhere in the house
        href: http://stream.opusgrid.home.arpa:8096
        icon: si:jellyfin
        container: jellyfin
        stack: Media
        meta:
          - { label: Library, value: 1.2 TB on disk }
      - name: Seerr
        app: Seerr
        description: Request queue for the household
        href: http://seerr.opusgrid.home.arpa:5055
        icon: mdi:movie-search-outline
        container: seerr
        stack: Media

  - name: Photos
    description: Every memory, backed up nightly
    services:
      - name: Lens
        app: Immich
        description: Photo library with machine learning on the phones
        href: http://lens.opusgrid.home.arpa:2283
        icon: si:immich
        container: immich
        stack: Photos
        meta:
          - { label: Backups, value: automatic }

  - name: Files
    description: Sync, docs, paper trail
    services:
      - name: Drive
        app: Nextcloud
        description: Files and calendar, self-hosted
        href: http://drive.opusgrid.home.arpa:8080
        icon: si:nextcloud
        container: nextcloud
        stack: Cloud
      - name: Docs
        app: Paperless-ngx
        description: The paper office, searchable
        href: http://docs.opusgrid.home.arpa:8010
        icon: si:paperlessngx
        container: paperless
        stack: Cloud

  - name: Music
    description: The long tail of the collection
    services:
      - name: Wave
        app: Navidrome
        description: Streaming the lossless collection
        href: http://wave.opusgrid.home.arpa:4533
        icon: lucide:waves
        container: navidrome
        stack: Media

  - name: Security
    description: Doors to the outside
    services:
      - name: Vault
        app: Vaultwarden
        description: Every key, in one place
        href: https://vault.opusgrid.example
        icon: si:vaultwarden
        container: vaultwarden
        stack: Secure

  - name: Home
    description: The house itself
    services:
      - name: Nest
        app: Home Assistant
        description: Lights, climate, the sensors in the walls
        href: http://nest.opusgrid.home.arpa:8123
        icon: si:homeassistant
        container: home-assistant
        stack: Home

  - name: OpusGrid
    description: The control center and its rails
    services:
      - name: Hub
        app: OpusHub
        description: This place
        href: /
        icon: mdi:hexagon-multiple
        meta:
          - { label: Role, value: control center }
