# OpusHub — presentation overlay (optional)
#
# Docker decides what EXISTS. This file only decides how a discovered container LOOKS.
#
#   • Every entry here must bind to a real container, by `container:` (a container name or id
#     prefix — authoritative) or by `name:` matching a container name / compose service name.
#   • An entry whose container is gone is NOT shown as a service. It is reported under
#     Settings → System → Service discovery as an unmatched overlay, and nowhere else.
#   • Nothing needs to be written here at all: with this file empty, OpusHub still discovers every
#     container, resolves its URL from Traefik/published ports, and derives its name and icon.
#   • URLs come from the engine. Set `url:` only to *override* what Traefik/published ports say —
#     that is the top of the precedence list, so it wins over real metadata. It is also the right
#     place for a URL your proxy knows about but does not publish in labels.
#
# Per entry:
#   container    docker container name or id prefix (recommended binding key)
#   name         label for this entry; also a binding key when `container` is absent
#   displayName  what the UI calls it (default: derived from the container/compose service name)
#   app          the software behind it, shown as identity (default: none — the image says)
#   description  one line, also searched
#   url          manual URL override (legacy `href` is read as `url`)
#   icon         lucide:*/mdi:*/si:* (bundled, offline-safe), http(s) URL, /user/icons/<file>, or an emoji
#   group        which group this service is filed under (default: its compose project, else "Other")
#   order        rank inside the group (drag-and-drop on the Services page wins over this)
#   hidden       true → left out of Services/Hub entirely (still visible in its stack)
#   showOnHub    false → listed on Services but not on the Hub launcher
#   keywords     extra search terms
#   meta         free-form key/value facts shown on the service page
#
# You can also put this metadata on the container itself, and OpusHub will pick it up with no
# config file at all (handy when the compose file is the thing you version):
#   labels:
#     opushub.displayName: Wave
#     opushub.group: Music
#     opushub.icon: lucide:waves
#     opushub.meta.Library: 312 GB FLAC
#     opushub.kind: infrastructure           # file it with the rails instead of the grid
#     opushub.url: http://192.0.2.10:4533        # manual override, urlSource: "manual"
#     opushub.hidden: "true"

groups: []

