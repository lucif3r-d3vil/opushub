# OpusHub — stack overlay (optional)
#
# A stack is a compose project. Docker decides which containers belong to it — from
# `com.docker.compose.project` (plus `.service`, `.container-number`, `.project.working_dir`) —
# and containers with no project label surface as standalone. Nothing here can create, add to,
# or remove a stack; this file only renames and annotates the ones the engine reports.
#
# Per entry:
#   project      the com.docker.compose.project value this overlay describes  ← the binding key
#   name         entry label; also matched as a project name (and, for entries with no
#                `project:`, treated as the friendly name of the project its members live in)
#   displayName  friendly name shown in the UI (default: humanized project name)
#   description  one line
#   icon         lucide:*/mdi:*/si:*, an http(s) URL, /user/icons/<file>, or an emoji
#   notes        shown on the stack page
#   services     LEGACY. Membership is decided by Docker now, so this list is only used to bind
#                an overlay to a project when no `project:` key is set; it cannot add members.
#
# Example — a compose project called `opustream` that you want called Media:
#
# stacks:
#   - project: opustream
#     displayName: Media
#     description: Streaming and requests
#     icon: lucide:clapperboard
#     notes: Transcodes run on the iGPU; keep an eye on the library volume.

stacks: []
